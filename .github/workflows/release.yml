name: Attach release package
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    if: ${{ github.repository == 'Sth32/dsh-workspace-model' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Test and pack the tagged source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          VERSION="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$VERSION"
          npm test
          npm pack
          sha256sum "dsh-workspace-model-$VERSION.tgz" > SHA256SUMS
      - name: Attach to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          gh release upload "$RELEASE_TAG" "dsh-workspace-model-${RELEASE_TAG#v}.tgz" SHA256SUMS
